<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Campus Panel Scorecard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f5f8fa;
  --fg:#101820; --muted:#5b6b7a; --faint:#8597a6;
  --line:#d5dee6; --line-strong:#b9c6d2;
  --accent:#0b6fa8; --accent-bright:#019DF0; --accent-soft:#e2f1fb;
  --asp:#019DF0; --rsp:#87BB00; --rsl:#FED720; --opn:#FF4B1E;
  --rsp-ink:#5a7d00; --opn-ink:#c43a12;
  --ok:#1b7f45; --ok-soft:#e3f4ea; --warn-ink:#9a6400;
  --shadow:0 1px 2px rgba(16,24,32,.06), 0 6px 18px rgba(16,24,32,.06);
  --font-display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#161e26; --surface-2:#1c262f;
    --fg:#e7eef4; --muted:#9bacba; --faint:#76889a;
    --line:#2a3741; --line-strong:#3a4b58;
    --accent:#56b6ea; --accent-bright:#2fa8ec; --accent-soft:#12293a;
    --rsp-ink:#a3cf3a; --opn-ink:#ff7d5a;
    --ok:#4cc27e; --ok-soft:#12301f; --warn-ink:#d8a53c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161e26; --surface-2:#1c262f;
  --fg:#e7eef4; --muted:#9bacba; --faint:#76889a;
  --line:#2a3741; --line-strong:#3a4b58;
  --accent:#56b6ea; --accent-bright:#2fa8ec; --accent-soft:#12293a;
  --rsp-ink:#a3cf3a; --opn-ink:#ff7d5a;
  --ok:#4cc27e; --ok-soft:#12301f; --warn-ink:#d8a53c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none !important}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1280px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .mark{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--accent);letter-spacing:-.01em}
.brand .mark span{color:var(--opn)}
.brand h1{font-size:19px;line-height:1.15}
.brand .sub{color:var(--muted);font-size:12.5px;white-space:nowrap}
.spacer{flex:1 1 auto}
.savechip{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);
  border:1px solid var(--line);white-space:nowrap}
.savechip[data-s="saved"]{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.savechip[data-s="error"]{color:var(--opn-ink)}

.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:20}
.tabs-in{display:flex;gap:2px;max-width:1280px;margin:0 auto;overflow-x:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;border-bottom:2.5px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);
  font-family:var(--font-display);font-size:15.5px;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent-bright)}

.wrap{max-width:1280px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.cols{display:grid;grid-template-columns:304px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:899px){
  .cols{grid-template-columns:minmax(0,1fr)}
  body[data-m="sheet"] .roster{display:none}
  body[data-m="roster"] .sheetpane{display:none}
  .backbtn{display:inline-flex}
}
.backbtn{display:none;align-items:center;gap:6px;background:none;border:0;color:var(--accent);font-weight:500;font-size:14px;
  cursor:pointer;padding:2px 0;margin-bottom:10px}

.mebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.mebar.need{border-color:var(--rsl)}
.mebar .mb-l{font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap}
.mebar input{flex:1 1 170px;min-width:0;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);
  color:var(--fg);font:inherit;font-size:14px;padding:7px 10px}
.mebar input:focus{border-color:var(--accent-bright)}
.mebar .mb-hint{flex:1 1 100%;font-size:12.5px;color:var(--warn-ink)}

.roster{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.roster-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:11px 14px;
  border-bottom:1px solid var(--line);background:var(--surface-2)}
.roster-head .t{font-family:var(--font-display);font-weight:600;font-size:15px}
.roster-head .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer}
.slot:last-child{border-bottom:0}
.slot:hover{background:var(--surface-2)}
.slot[aria-current="true"]{background:var(--accent-soft)}
.slot .tm{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;width:5.4ch;line-height:1.25}
.slot .nm{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.slot[aria-current="true"] .nm{color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong);flex:none}
.dot.sent{background:var(--ok)}
.dot.part{background:var(--rsl)}
.brk{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);
  font-size:11.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}

.sheetpane{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.sheet-head{padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head .eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500}
.sheet-head h2{font-size:27px;line-height:1.1;margin-top:3px}
.sheet-head .meta{color:var(--muted);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.sec{padding:16px 18px}
.sec + .sec{border-top:1px solid var(--line)}
.sec-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:3px}
.sec-t h3{font-size:17px}
.sec-t .note{font-size:12.5px;color:var(--faint)}
.sec-sub{font-size:13px;color:var(--muted);margin:0 0 14px;max-width:62ch}

.crit{padding:13px 0;border-top:1px dashed var(--line)}
.crit:first-of-type{border-top:0;padding-top:4px}
.crit .lab{font-weight:600;font-size:14.5px}
.crit .hint{font-size:12.5px;color:var(--muted);margin:2px 0 9px;max-width:60ch}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{flex:1 1 56px;min-width:52px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;
  padding:7px 4px;cursor:pointer;text-align:center;line-height:1.15}
.sbtn b{display:block;font-family:var(--font-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sbtn i{display:block;font-style:normal;font-size:10px;color:var(--faint);margin-top:1px}
.sbtn:hover{border-color:var(--accent-bright)}
.sbtn[aria-pressed="true"]{background:var(--accent-bright);border-color:var(--accent-bright);color:#fff}
.sbtn[aria-pressed="true"] i{color:rgba(255,255,255,.82)}

.arro{display:grid;gap:12px}
.trait{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.trait-h{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.trait-h .pip{width:11px;height:11px;border-radius:50%;flex:none}
.trait-h .n{font-family:var(--font-display);font-weight:600;font-size:16px}
.trait-h .zh{font-size:12px;color:var(--faint)}
.trait-cue{padding:7px 12px;font-size:12px;color:var(--faint);line-height:1.35;border-bottom:1px solid var(--line)}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--line);padding:9px 12px;cursor:pointer}
.lvl:first-child{border-top:0}
.lvl:hover{background:var(--surface-2)}
.lvl .tag{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.04em;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap;margin-top:1px}
.lvl .d{font-size:13px;color:var(--muted);line-height:1.42}
.lvl[aria-pressed="true"]{background:var(--surface-2)}
.lvl[aria-pressed="true"] .d{color:var(--fg)}
.lvl[aria-pressed="true"] .tag{color:#fff;border-color:transparent}
.trait[data-k="A"] .lvl[aria-pressed="true"] .tag{background:var(--asp)}
.trait[data-k="R"] .lvl[aria-pressed="true"] .tag{background:var(--rsp)}
.trait[data-k="S"] .lvl[aria-pressed="true"] .tag{background:var(--rsl);color:#101820}
.trait[data-k="O"] .lvl[aria-pressed="true"] .tag{background:var(--opn)}
.lvl.none .d{font-style:italic}

.deptgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.dept{border:1px solid var(--line);border-radius:9px;padding:11px 12px}
.dept h4{margin:0 0 8px;font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;cursor:pointer;font-size:14px}
.chk input{margin:3px 0 0;accent-color:var(--accent-bright);width:16px;height:16px;flex:none}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{flex:1 1 110px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:9px 10px;
  cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:15px}
.pbtn:hover{border-color:var(--accent-bright)}
.pbtn[aria-pressed="true"][data-v="yes"]{background:var(--ok);border-color:var(--ok);color:#fff}
.pbtn[aria-pressed="true"][data-v="maybe"]{background:var(--rsl);border-color:var(--rsl);color:#101820}
.pbtn[aria-pressed="true"][data-v="no"]{background:var(--muted);border-color:var(--muted);color:#fff}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--surface);color:var(--fg);font:inherit;font-size:14px;padding:10px 11px}
textarea:focus{border-color:var(--accent-bright)}

.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;
  font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent-bright);color:var(--accent)}
.btn.pri{background:var(--accent-bright);border-color:var(--accent-bright);color:#fff;font-weight:600}
.btn.pri:hover{color:#fff;filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.foot .hintline{font-size:12.5px;color:var(--muted)}
.foot .sentmark{font-size:12.5px;color:var(--ok);font-weight:600}

.banner{display:flex;gap:10px;align-items:flex-start;border-radius:9px;padding:11px 13px;font-size:13.5px;margin-bottom:14px;
  background:var(--accent-soft);color:var(--fg)}
.banner.warn{background:#fff4e0;color:#5c3d00}
:root[data-theme="dark"] .banner.warn{background:#30220a;color:#f0d9a8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner.warn{background:#30220a;color:#f0d9a8}}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:40px 22px;text-align:center}
.empty h2{font-size:21px;margin-bottom:6px}
.empty p{color:var(--muted);font-size:14px;margin:0 auto;max-width:44ch}
.endbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-top:14px;box-shadow:var(--shadow)}
.endbar .el{font-size:13px;color:var(--muted);flex:1 1 220px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="mark">Geek<span>+</span></span>
      <h1>Campus Panel Scorecard</h1>
      <span class="sub">2027 New Grad &middot; Oct 27&ndash;28</span>
    </div>
    <span class="spacer"></span>
    <span class="savechip" id="saveChip" data-s="idle">Draft saved on this device</span>
  </div>
</header>

<nav class="tabs"><div class="tabs-in" id="tabs" role="tablist"></div></nav>

<div class="wrap">
  <div id="notice"></div>
  <div id="meBar"></div>
  <div class="cols" id="dayView">
    <aside class="roster" id="roster"></aside>
    <section class="sheetpane" id="sheetpane"></section>
  </div>
  <div class="endbar" id="endBar"></div>
</div>

<script>
"use strict";

/* ==========================================================================
   CONFIG — fill in after the Google Form exists.
   Paste the "Get pre-filled link" URL and read the entry.XXXX ids from it.
   Until `action` is set, the page works but the Submit button is replaced
   by "Copy this scorecard".
   ========================================================================== */
var FORM = {
  action: "",            /* https://docs.google.com/forms/d/e/<id>/formResponse */
  f: {
    name:      "",       /* entry.0000000 — Panel member            */
    team:      "",       /* entry.0000000 — Team                    */
    candidate: "",       /* entry.0000000 — Candidate               */
    prep:      "",       /* entry.0000000 — Preparation (1-5)       */
    ai:        "",       /* entry.0000000 — Use of AI (1-5)         */
    style:     "",       /* entry.0000000 — Presentation style (1-5)*/
    arroA:     "",       /* entry.0000000 — Aspirational            */
    arroR:     "",       /* entry.0000000 — Responsible             */
    arroS:     "",       /* entry.0000000 — Resilient               */
    arroO:     "",       /* entry.0000000 — Open-minded             */
    roles:     "",       /* entry.0000000 — Recommended roles       */
    round2:    "",       /* entry.0000000 — Round 2                 */
    comments:  ""        /* entry.0000000 — Comments                */
  }
};
function formReady(){ return !!(FORM.action && FORM.f.candidate); }

/* ---------------- schedule ---------------- */
var DAYS = [
  { id:"d1", label:"Tue, Oct 27", short:"Oct 27", slots:[
    { t:"12:30", e:"12:45", n:"Nayara Paudyal" },
    { t:"12:45", e:"1:00",  n:"Chenzhuo Tong" },
    { t:"1:00",  e:"1:15",  n:"Yutao Xu" },
    { t:"1:15",  e:"1:30",  n:"Kong Xiangrui" },
    { t:"1:45",  e:"2:00",  n:"Lindsey Zhang" },
    { br:true },
    { t:"2:15",  e:"2:30",  n:"Xiaowei Deng" },
    { t:"2:30",  e:"2:45",  n:"Watemberg Joel" },
    { t:"2:45",  e:"3:00",  n:"Yutong Guo" },
    { t:"3:00",  e:"3:15",  n:"Gaurang Kamat" }
  ]},
  { id:"d2", label:"Wed, Oct 28", short:"Oct 28", slots:[
    { t:"12:30", e:"12:45", n:"Fan Ming Cheng" },
    { t:"12:45", e:"1:00",  n:"Jatin Patel" },
    { t:"1:00",  e:"1:15",  n:"Riley Xiong" },
    { t:"1:15",  e:"1:30",  n:"Hsued Shang-Chi" },
    { t:"1:30",  e:"1:45",  n:"Jaime Poza Moreno" },
    { t:"1:45",  e:"2:00",  n:"Shaochen Ma" },
    { br:true },
    { t:"2:15",  e:"2:30",  n:"Harshali Aherao" },
    { t:"2:30",  e:"2:45",  n:"Rutuja Kawade" },
    { t:"2:45",  e:"3:00",  n:"Joe Zhu" },
    { t:"3:00",  e:"3:15",  n:"Chen, Wei Yu" }
  ]}
];

var CANDS = [];
DAYS.forEach(function(d){
  var i = 0;
  d.slots.forEach(function(s){
    if (s.br) return;
    i++;
    var id = d.id + "-" + (i < 10 ? "0" + i : "" + i);
    s.cand = { id:id, day:d.id, dayLabel:d.short, time:s.t + " – " + s.e, name:s.n, order:i };
    CANDS.push(s.cand);
  });
});
var CAND_BY_ID = {};
CANDS.forEach(function(c){ CAND_BY_ID[c.id] = c; });

var CRITERIA = [
  { k:"prep",  lab:"Preparation & Research Depth",
    hint:"The product research itself: specific details, correct facts, and their own reading of it rather than a copy of the website." },
  { k:"ai",    lab:"Use of AI",
    hint:"Decoration counts too — what matters is whether they put AI to good use, and whether there was any creativity in how they used it. Score low if they barely used it, used it in a very basic way, or passed on something AI got wrong without checking it." },
  { k:"style", lab:"Presentation Style",
    hint:"Clear structure, confident delivery, and holding the 15 minutes without running long or finishing early." }
];
var SCALE = [{v:1,l:"Poor"},{v:2,l:"Below bar"},{v:3,l:"Meets bar"},{v:4,l:"Strong"},{v:5,l:"Outstanding"}];

var ARRO = [
  { k:"A", name:"Aspirational", zh:"高追求", cls:"A",
    cue:"how far past the brief they went, and the goals they set themselves in past work", levels:[
    "Covered what was asked. The product section stays close to what is on our website.",
    "Went looking beyond the brief: dug up something our site does not tell them, or set themselves a harder version of the task.",
    "Aimed to be the best in the room. The research has a genuine angle of their own, and their past work shows a habit of raising their own bar." ]},
  { k:"R", name:"Responsible", zh:"敢担当", cls:"R",
    cue:"how they describe their own role in past projects", levels:[
    "Describes what they were assigned and that they finished it. Their own role stays vague — mostly “we”.",
    "Clear on what they personally decided and did. Stepped in where the task was undefined, and credits teammates specifically.",
    "Owns the outcome, including what did not work. Took on something hard or unglamorous and stayed with it to the end." ]},
  { k:"S", name:"Resilient", zh:"有韧性", cls:"S",
    cue:"setback stories, plus how they handle the live moment", levels:[
    "Mentions a difficulty and that they got through it. Holds it together on stage.",
    "Names a real setback and what they changed because of it. A stumble or a tech hiccup does not throw them.",
    "Stuck with something hard over real time, without blaming anyone else. Recovers from a live problem and keeps the room with them." ]},
  { k:"O", name:"Open-minded", zh:"够开放", cls:"O",
    cue:"how they researched, and whether they can name their own gaps", levels:[
    "Curious. Clearly looked around and is interested in the industry.",
    "Brought in an outside view: compared us to another approach, or used sources beyond our website. Names a gap in their own knowledge.",
    "Pulled several viewpoints into a view of their own. Says plainly what they want to learn here, not only what they already bring." ]}
];

var DEPTS = [
  { d:"Supply Chain",     roles:["Associate Quality Engineer","Associate Manufacturing Engineer"] },
  { d:"Project Delivery", roles:["Associate Project Manager","Deployment Engineer"] },
  { d:"Solution",         roles:["Solutions Engineer"] },
  { d:"System",           roles:["System Engineer"] }
];
var ALL_ROLES = [];
DEPTS.forEach(function(x){ x.roles.forEach(function(r){ ALL_ROLES.push(r); }); });
var ROUND2 = [{v:"Yes",l:"Yes"},{v:"Maybe",l:"Maybe"},{v:"No",l:"No"}];

/* ---------------- state + local storage ---------------- */
var KEY = "gkp2027panel.v1";
var S = { tab:DAYS[0].id, sel:null, entries:{}, profile:{name:"",team:""} };

function blank(){ return { prep:null, ai:null, style:null, arro:{A:null,R:null,S:null,O:null},
                           roles:[], round2:null, comments:"", sentAt:null }; }
function entryOf(id){ if (!S.entries[id]) S.entries[id] = blank(); return S.entries[id]; }

function loadLocal(){
  try{
    var raw = window.localStorage.getItem(KEY);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (o && typeof o === "object"){
      if (o.profile) S.profile = { name:o.profile.name||"", team:o.profile.team||"" };
      if (o.entries) Object.keys(o.entries).forEach(function(k){
        if (CAND_BY_ID[k]) S.entries[k] = Object.assign(blank(), o.entries[k]);
      });
    }
  }catch(e){ /* private window, blocked storage: carry on in memory */ }
}
function saveLocal(){
  try{
    window.localStorage.setItem(KEY, JSON.stringify({ profile:S.profile, entries:S.entries }));
    setChip("saved");
  }catch(e){ setChip("error"); }
}
function setChip(s){
  var c = document.getElementById("saveChip");
  c.dataset.s = s === "error" ? "error" : (s === "saved" ? "saved" : "idle");
  c.textContent = s === "error" ? "Not saved on this device — copy your scores before closing"
                : "Draft saved on this device";
}

/* ---------------- helpers ---------------- */
function el(tag, cls, txt){ var n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function hasAny(e){
  if (!e) return false;
  if (e.prep || e.ai || e.style || e.round2) return true;
  if (e.comments && e.comments.trim()) return true;
  if (e.roles && e.roles.length) return true;
  var a = e.arro || {};
  return a.A != null || a.R != null || a.S != null || a.O != null;
}
function isComplete(e){ return !!(e && e.prep && e.ai && e.style && e.round2); }
function arroText(v){ return v === 0 ? "Not enough evidence" : (v ? "L" + v : ""); }

/* ---------------- tabs ---------------- */
function renderTabs(){
  var bar = document.getElementById("tabs");
  clear(bar);
  DAYS.forEach(function(d){
    var b = el("button","tab",d.label);
    b.type="button"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", S.tab===d.id ? "true":"false");
    b.onclick = function(){ S.tab=d.id; S.sel=null; document.body.dataset.m="roster"; render(); };
    bar.appendChild(b);
  });
}

/* ---------------- who is scoring ---------------- */
function renderMeBar(){
  var host = document.getElementById("meBar");
  if (host.dataset.built === "1"){
    var n0=document.getElementById("hm-name"), t0=document.getElementById("hm-team");
    if (n0 && document.activeElement!==n0) n0.value = S.profile.name||"";
    if (t0 && document.activeElement!==t0) t0.value = S.profile.team||"";
    if (host.firstChild) host.firstChild.className = "mebar" + (S.profile.name ? "" : " need");
    var h=document.getElementById("mb-hint"); if (h) h.hidden = !!S.profile.name;
    return;
  }
  clear(host);
  var box = el("div","mebar" + (S.profile.name ? "" : " need"));
  box.appendChild(el("span","mb-l","Scoring as"));
  var n=document.createElement("input");
  n.type="text"; n.id="hm-name"; n.placeholder="Your name"; n.autocomplete="name";
  n.value=S.profile.name||"";
  n.oninput=function(){ S.profile.name=n.value; saveLocal(); renderMeBar(); renderSheet(); };
  box.appendChild(n);
  var t=document.createElement("input");
  t.type="text"; t.id="hm-team"; t.placeholder="Your team (optional)";
  t.value=S.profile.team||"";
  t.oninput=function(){ S.profile.team=t.value; saveLocal(); };
  box.appendChild(t);
  var h2=el("span","mb-hint","Enter your name before you submit — HR needs to know whose scores these are.");
  h2.id="mb-hint"; h2.hidden=!!S.profile.name;
  box.appendChild(h2);
  host.appendChild(box);
  host.dataset.built="1";
}

/* ---------------- roster ---------------- */
function renderRoster(){
  var host=document.getElementById("roster");
  clear(host);
  var day = DAYS.filter(function(d){ return d.id===S.tab; })[0];
  if (!day) return;
  var total = day.slots.filter(function(s){ return !s.br; }).length;
  var sent = 0;
  day.slots.forEach(function(s){ if (s.cand && S.entries[s.cand.id] && S.entries[s.cand.id].sentAt) sent++; });

  var h=el("div","roster-head");
  h.appendChild(el("span","t",day.label));
  h.appendChild(el("span","c", sent + " of " + total + " submitted"));
  host.appendChild(h);

  day.slots.forEach(function(s){
    if (s.br){
      var br=el("div","brk");
      br.appendChild(el("span",null,"2:00 – 2:15"));
      br.appendChild(el("span",null,"Break"));
      host.appendChild(br);
      return;
    }
    var c=s.cand, e=S.entries[c.id];
    var b=el("button","slot"); b.type="button";
    b.setAttribute("aria-current", S.sel===c.id ? "true":"false");
    b.appendChild(el("span","tm", c.time.split(" – ")[0]));
    var mid=el("span"); mid.appendChild(el("span","nm", c.name)); b.appendChild(mid);
    var cls = (e && e.sentAt) ? " sent" : (hasAny(e) ? " part" : "");
    var d=el("span","dot"+cls);
    d.title = (e && e.sentAt) ? "Submitted" : (hasAny(e) ? "Draft, not submitted" : "Not scored");
    b.appendChild(d);
    b.onclick=function(){ S.sel=c.id; document.body.dataset.m="sheet"; render(); window.scrollTo({top:0,behavior:"smooth"}); };
    host.appendChild(b);
  });
}

/* ---------------- scorecard ---------------- */
function renderSheet(){
  var host=document.getElementById("sheetpane");
  clear(host);

  if (!S.sel){
    var em=el("div","empty");
    em.appendChild(el("h2",null,"Pick a candidate to start"));
    em.appendChild(el("p",null,"Choose a name from the schedule. Your answers stay on this device until you submit them, and no one else on the panel sees them."));
    host.appendChild(em);
    return;
  }

  var c=CAND_BY_ID[S.sel], e=entryOf(c.id);

  var back=el("button","backbtn"); back.type="button";
  back.textContent="←  All candidates";
  back.onclick=function(){ document.body.dataset.m="roster"; render(); };
  host.appendChild(back);

  var card=el("div","card");
  var hd=el("div","sheet-head");
  hd.appendChild(el("div","eyebrow", c.dayLabel + "  ·  Candidate " + c.order));
  hd.appendChild(el("h2",null,c.name));
  hd.appendChild(el("div","meta", c.time + " ET  ·  15-minute presentation"));
  card.appendChild(hd);

  var s1=el("div","sec");
  var t1=el("div","sec-t"); t1.appendChild(el("h3",null,"Presentation"));
  t1.appendChild(el("span","note","1 = Poor  ·  5 = Outstanding"));
  s1.appendChild(t1);
  s1.appendChild(el("p","sec-sub","How well they built and delivered the 15 minutes."));
  CRITERIA.forEach(function(cr){
    var w=el("div","crit");
    w.appendChild(el("div","lab",cr.lab));
    w.appendChild(el("div","hint",cr.hint));
    var row=el("div","scale");
    SCALE.forEach(function(sc){
      var b=el("button","sbtn"); b.type="button";
      b.setAttribute("aria-pressed", e[cr.k]===sc.v ? "true":"false");
      b.setAttribute("aria-label", cr.lab + ": " + sc.v + " " + sc.l);
      b.appendChild(el("b",null,String(sc.v)));
      b.appendChild(el("i",null,sc.l));
      b.onclick=function(){ e[cr.k] = (e[cr.k]===sc.v ? null : sc.v); touch(); };
      row.appendChild(b);
    });
    w.appendChild(row);
    s1.appendChild(w);
  });
  card.appendChild(s1);

  var s2=el("div","sec");
  var t2=el("div","sec-t"); t2.appendChild(el("h3",null,"ARRO Talent Traits"));
  t2.appendChild(el("span","note","Pick the level you actually saw evidence for"));
  s2.appendChild(t2);
  s2.appendChild(el("p","sec-sub","Some traits only show if the candidate chose to tell that kind of story. “Not enough evidence” is a fair answer and not a low score — don't guess."));
  var grid=el("div","arro");
  ARRO.forEach(function(tr){
    var box=el("div","trait"); box.dataset.k=tr.cls;
    var hh=el("div","trait-h");
    var pip=el("span","pip");
    pip.style.background = tr.k==="A"?"var(--asp)":tr.k==="R"?"var(--rsp)":tr.k==="S"?"var(--rsl)":"var(--opn)";
    hh.appendChild(pip);
    hh.appendChild(el("span","n",tr.name));
    hh.appendChild(el("span","zh",tr.zh));
    box.appendChild(hh);
    box.appendChild(el("div","trait-cue","Look for: " + tr.cue + "."));
    tr.levels.forEach(function(txt,i){
      var val=i+1;
      var b=el("button","lvl"); b.type="button";
      b.setAttribute("aria-pressed", e.arro[tr.k]===val ? "true":"false");
      b.appendChild(el("span","tag","L"+val));
      b.appendChild(el("span","d",txt));
      b.onclick=function(){ e.arro[tr.k] = (e.arro[tr.k]===val ? null : val); touch(); };
      box.appendChild(b);
    });
    var bn=el("button","lvl none"); bn.type="button";
    bn.setAttribute("aria-pressed", e.arro[tr.k]===0 ? "true":"false");
    bn.appendChild(el("span","tag","–"));
    bn.appendChild(el("span","d","Not enough evidence"));
    bn.onclick=function(){ e.arro[tr.k] = (e.arro[tr.k]===0 ? null : 0); touch(); };
    box.appendChild(bn);
    grid.appendChild(box);
  });
  s2.appendChild(grid);
  card.appendChild(s2);

  var s3=el("div","sec");
  var t3=el("div","sec-t"); t3.appendChild(el("h3",null,"Recommended Roles"));
  t3.appendChild(el("span","note","Pick any that fit — your team or another"));
  s3.appendChild(t3);
  s3.appendChild(el("p","sec-sub","Where would you put this person? Recommending another team's role is encouraged."));
  var dg=el("div","deptgrid");
  DEPTS.forEach(function(dp){
    var box=el("div","dept");
    box.appendChild(el("h4",null,dp.d));
    dp.roles.forEach(function(r){
      var lab=el("label","chk");
      var cb=document.createElement("input");
      cb.type="checkbox";
      cb.id = "role-" + c.id + "-" + r.replace(/[^A-Za-z0-9]/g,"");
      cb.checked = e.roles.indexOf(r) !== -1;
      cb.onchange=function(){
        var i=e.roles.indexOf(r);
        if (cb.checked && i===-1) e.roles.push(r);
        if (!cb.checked && i!==-1) e.roles.splice(i,1);
        touch();
      };
      lab.appendChild(cb);
      lab.appendChild(el("span",null,r));
      box.appendChild(lab);
    });
    dg.appendChild(box);
  });
  s3.appendChild(dg);
  card.appendChild(s3);

  var s4=el("div","sec");
  var t4=el("div","sec-t"); t4.appendChild(el("h3",null,"Move to Round 2?"));
  s4.appendChild(t4);
  s4.appendChild(el("p","sec-sub","Would you want this candidate in a department interview?"));
  var pick=el("div","pick");
  ROUND2.forEach(function(o){
    var b=el("button","pbtn",o.l); b.type="button"; b.dataset.v=o.v.toLowerCase();
    b.setAttribute("aria-pressed", e.round2===o.v ? "true":"false");
    b.onclick=function(){ e.round2 = (e.round2===o.v ? null : o.v); touch(); };
    pick.appendChild(b);
  });
  s4.appendChild(pick);

  var cw=el("div","crit");
  cw.appendChild(el("div","lab","Comments"));
  cw.appendChild(el("div","hint","One or two lines: what stood out, and anything that gives you pause."));
  var ta=document.createElement("textarea");
  ta.id="cm-"+c.id;
  ta.value=e.comments||"";
  ta.placeholder="Strongest part of the presentation, and any concern…";
  ta.oninput=function(){ e.comments=ta.value; saveLocal(); };
  cw.appendChild(ta);
  s4.appendChild(cw);
  card.appendChild(s4);

  /* footer */
  var ft=el("div","foot");
  if (formReady()){
    var sb=el("button","btn pri", e.sentAt ? "Re-submit" : "Submit to HR");
    sb.type="button";
    sb.disabled = !S.profile.name;
    sb.onclick=function(){ submitOne(c.id, sb); };
    ft.appendChild(sb);
  }
  var cb2=el("button","btn", formReady() ? "Copy" : "Copy this scorecard"); cb2.type="button";
  cb2.onclick=function(){ copyText(oneRow(c.id, true), cb2, formReady() ? "Copy" : "Copy this scorecard"); };
  ft.appendChild(cb2);

  if (e.sentAt) ft.appendChild(el("span","sentmark","Submitted " + e.sentAt));
  else if (!S.profile.name) ft.appendChild(el("span","hintline","Enter your name at the top first."));
  else if (!isComplete(e)) ft.appendChild(el("span","hintline","You can submit now and re-submit later if you change your mind."));

  var nxt=nextCandidate(c);
  if (nxt){
    var nb=el("button","btn","Next: " + nxt.name.split(",")[0]);
    nb.type="button";
    nb.onclick=function(){ S.sel=nxt.id; render(); window.scrollTo({top:0,behavior:"smooth"}); };
    ft.appendChild(nb);
  }
  card.appendChild(ft);
  host.appendChild(card);
}

function nextCandidate(c){
  var list=CANDS.filter(function(x){ return x.day===c.day; });
  var i=list.map(function(x){ return x.id; }).indexOf(c.id);
  return (i>-1 && i<list.length-1) ? list[i+1] : null;
}
function touch(){ saveLocal(); render(); }

/* ---------------- submit ---------------- */
function buildFD(id){
  var e=entryOf(id), c=CAND_BY_ID[id];
  var fd=new FormData();
  function put(key, val){ if (FORM.f[key]) fd.append(FORM.f[key], val == null ? "" : String(val)); }
  put("name",      S.profile.name);
  put("team",      S.profile.team);
  put("candidate", c.dayLabel + " " + c.time + " — " + c.name);
  put("prep",      e.prep);
  put("ai",        e.ai);
  put("style",     e.style);
  put("arroA",     arroText(e.arro.A));
  put("arroR",     arroText(e.arro.R));
  put("arroS",     arroText(e.arro.S));
  put("arroO",     arroText(e.arro.O));
  put("roles",     (e.roles||[]).join(", "));
  put("round2",    e.round2);
  put("comments",  e.comments);
  return fd;
}
function stampSent(id){
  var d=new Date();
  entryOf(id).sentAt = ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
}
function postOne(id){
  return fetch(FORM.action, { method:"POST", mode:"no-cors", body:buildFD(id) })
    .then(function(){ stampSent(id); return true; })
    .catch(function(){ return false; });
}
function submitOne(id, btn){
  if (!S.profile.name || !formReady()) return;
  btn.disabled=true; btn.textContent="Sending…";
  postOne(id).then(function(ok){
    saveLocal();
    if (ok){ noticeText=null; render(); }
    else {
      btn.disabled=false;
      btn.textContent="Send failed — tap to retry";
      showNotice("That submission did not go through. Check your connection and tap again, or use Copy and send your scores to Stella.", true);
    }
  });
}
function submitAllUnsent(btn){
  if (!formReady() || !S.profile.name) return;
  var pending = CANDS.filter(function(c){
    var e=S.entries[c.id]; return e && hasAny(e) && !e.sentAt;
  });
  if (!pending.length) return;
  btn.disabled=true;
  var i=0, failed=0;
  (function step(){
    if (i >= pending.length){
      saveLocal(); render();
      if (failed) showNotice(failed + " of " + pending.length + " did not go through. Tap the button again, or use “Copy all my scorecards” and send them to Stella.", true);
      return;
    }
    var id = pending[i++].id;
    btn.textContent = "Sending " + i + " of " + pending.length + "…";
    postOne(id).then(function(ok){ if(!ok) failed++; setTimeout(step, 400); });
  })();
}

/* ---------------- copy ---------------- */
var HEAD = ["Panel member","Team","Day","Time","Candidate","Preparation","Use of AI","Presentation style",
            "Aspirational","Responsible","Resilient","Open-minded","Recommended roles","Round 2","Comments"];
function oneRow(id, withHeader){
  var e=entryOf(id), c=CAND_BY_ID[id];
  var r=[S.profile.name, S.profile.team, c.dayLabel, c.time, c.name,
         e.prep||"", e.ai||"", e.style||"",
         arroText(e.arro.A), arroText(e.arro.R), arroText(e.arro.S), arroText(e.arro.O),
         (e.roles||[]).join("; "), e.round2||"", (e.comments||"").replace(/\s+/g," ")];
  return (withHeader ? HEAD.join("\t") + "\n" : "") + r.join("\t");
}
function allRows(){
  var out=[HEAD.join("\t")];
  CANDS.forEach(function(c){ if (hasAny(S.entries[c.id])) out.push(oneRow(c.id,false)); });
  return out.join("\n");
}
function copyText(text, btn, restore){
  var done=function(){ btn.textContent="Copied"; setTimeout(function(){ btn.textContent=restore; },1800); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ selectFallback(text,btn,restore); });
  } else selectFallback(text,btn,restore);
}
function selectFallback(text, btn, restore){
  var ta=document.createElement("textarea");
  ta.value=text;
  ta.style.position="fixed"; ta.style.left="0"; ta.style.top="0"; ta.style.width="1px"; ta.style.height="1px"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); btn.textContent="Copied"; }
  catch(err){ btn.textContent="Copy failed"; }
  setTimeout(function(){ try{ document.body.removeChild(ta); }catch(e2){} btn.textContent=restore; },1800);
}

/* ---------------- notices + end bar ---------------- */
var noticeText=null, noticeWarn=false;
function showNotice(t, warn){ noticeText=t; noticeWarn=!!warn; renderNotice(); }
function renderNotice(){
  var host=document.getElementById("notice");
  clear(host);
  if (!formReady()){
    var b0=el("div","banner warn");
    b0.appendChild(el("span",null,"This page is not connected to the response form yet. You can still score and use Copy, but Submit is unavailable."));
    host.appendChild(b0);
  }
  if (noticeText){
    var b=el("div","banner" + (noticeWarn ? " warn":""));
    b.appendChild(el("span",null,noticeText));
    host.appendChild(b);
  }
}
function renderEndBar(){
  var host=document.getElementById("endBar");
  clear(host);
  var scored=CANDS.filter(function(c){ return hasAny(S.entries[c.id]); }).length;
  var sent=CANDS.filter(function(c){ return S.entries[c.id] && S.entries[c.id].sentAt; }).length;
  var pending=CANDS.filter(function(c){ var e=S.entries[c.id]; return e && hasAny(e) && !e.sentAt; }).length;
  host.appendChild(el("span","el", scored + " scored on this device  ·  " + sent + " submitted"
    + (pending ? "  ·  " + pending + " not sent yet" : "")
    + ". Drafts live only in this browser, so send or copy them before you close the tab."));
  if (formReady() && pending){
    var sa=el("button","btn pri","Submit the " + pending + " not sent yet"); sa.type="button";
    sa.disabled = !S.profile.name;
    sa.onclick=function(){ submitAllUnsent(sa); };
    host.appendChild(sa);
  }
  var cb=el("button","btn","Copy all my scorecards"); cb.type="button";
  cb.onclick=function(){ copyText(allRows(), cb, "Copy all my scorecards"); };
  host.appendChild(cb);
}

/* ---------------- render ---------------- */
function renderAllButSheet(){ renderTabs(); renderNotice(); renderMeBar(); renderRoster(); renderEndBar(); }
function render(){ renderAllButSheet(); renderSheet(); }

loadLocal();
document.body.dataset.m = "roster";
render();
window.addEventListener("beforeunload", function(){ saveLocal(); });
</script>
